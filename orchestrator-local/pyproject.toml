[project]
name = "mflux-orchestrator"
version = "0.1.0"
description = "MFlux Orchestrator -- local runtime. This is a deployed copy of the Orchestrator half of the mflux-runpod repo (app/main.py + its dependencies), refreshed via `just update-orchestrator` from that repo. Source of truth for the code is mflux-runpod -- don't hand-edit app/*.py here, it'll be overwritten on the next sync. data/reports.sqlite and data/models_hf.json are this deployment's own runtime state and are never touched by the sync."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
    "huggingface-hub>=0.26",
    "httpx>=0.27",
    "boto3>=1.34",
]
