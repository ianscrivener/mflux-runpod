name: Deploy to RunPod Flash

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: Deploy or tear down the RunPod Flash endpoints
        required: true
        type: choice
        options:
          - deploy
          - undeploy
        default: deploy

# Serialise deploys. Two overlapping runs on 2026-08-18 raced: the newer one
# deployed all three endpoints, then the older one's clean-slate step deleted
# them and failed, leaving the account with ZERO endpoints despite a
# "successful" deploy. cancel-in-progress stops the superseded run before it
# can tear down what a later run just created.
concurrency:
  group: runpod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    runs-on: ubuntu-latest
    environment: runpod
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Verify RunPod credentials
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        # flash undeploy's exit code can't be trusted to tell "endpoint not
        # found" apart from "couldn't authenticate" -- both print
        # "no endpoints found" and exit 0 (verified locally: a bad
        # RUNPOD_API_KEY produces the identical message/exit code as a
        # genuinely absent endpoint). Fail fast here, before undeploy/deploy
        # run against what might be a bad key, by hitting the REST API
        # directly and checking for 401/403.
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            https://rest.runpod.io/v1/endpoints)
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "RUNPOD_API_KEY rejected by RunPod API (HTTP $status)"
            exit 1
          fi

      - name: flash undeploy (clean slate)
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        # flash deploy always creates new endpoints rather than updating an
        # existing one by name -- without this, every re-run of this workflow
        # leaves the previous run's endpoints orphaned and billing. Scoped by
        # name (not --all) so this can't touch any other endpoint on the
        # account. `|| true` on each is now safe to mean "not found" only,
        # since the credentials step above already ruled out an auth
        # failure; a first-ever deploy has nothing to remove yet either way.
        # Deletes ALL endpoints matching each name via the REST API, not
        # `flash undeploy` -- confirmed 2026-08-18 that `flash undeploy <name>`
        # removes only ONE endpoint per invocation, so once duplicates exist it
        # leaves the rest behind. Two "successful" deploys had accumulated 7
        # endpoints (3 orchestrators, 2 runners, 2 health) that way.
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          T = os.environ["RUNPOD_API_KEY"]
          NAMES = {"mflux-runner", "mflux-runner-health", "mflux-orchestrator"}

          def api(path, method="GET"):
              req = urllib.request.Request(f"https://rest.runpod.io/v1{path}", method=method)
              req.add_header("Authorization", f"Bearer {T}")
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read()) if r.status != 204 else None

          endpoints = api("/endpoints") or []
          targets = [e for e in endpoints if e.get("name") in NAMES]
          print(f"{len(endpoints)} endpoints, {len(targets)} matching ours")
          for e in targets:
              try:
                  api(f"/endpoints/{e['id']}", method="DELETE")
                  print(f"  deleted {e['name']} ({e['id']})")
              except urllib.error.HTTPError as exc:
                  # 404 = already gone (fine). Anything else is a real failure
                  # and must not be swallowed, or we'd deploy on top of leftovers.
                  if exc.code != 404:
                      raise SystemExit(f"delete failed for {e['id']}: {exc.code} {exc.read()[:200]}")
          EOF

      - name: flash deploy
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: uv run flash deploy

      - name: Post-deploy health check
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: uv run python scripts/check_runner_health.py

  undeploy:
    if: github.event.inputs.action == 'undeploy'
    runs-on: ubuntu-latest
    environment: runpod
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: flash undeploy
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: uv run flash undeploy --all --force
